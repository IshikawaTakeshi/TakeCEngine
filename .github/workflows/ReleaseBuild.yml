name: ReleaseBuild
on:
  push:
    branches:
      - master

env:
  SOLUTION_FILE_PATH: project/DirectXGame.sln
  CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Add NuGet to PATH
        uses: NuGet/setup-nuget@v2
      - name: Restore packages
        run: nuget restore project/packages.config -PackagesDirectory project/packages
      - name: Generate projects
        run: premake\GenerateProject.bat v143
      - name: Build
        run: msbuild ${{ env.SOLUTION_FILE_PATH }} /p:Platform=x64 /p:Configuration=${{ env.CONFIGURATION }} /p:PlatformToolset=v143 /m
