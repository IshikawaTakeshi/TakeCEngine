name: ReleaseBuild
on:
  push:
    branches:
      - Ver.1.0/Develop
env:
  SOLUTION_FILE_PATH: project/DirectXGame.sln
  CONFIGURATION: Release
jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
    - name: Release
      run: |
        msbuild ${{env.SOLUTION_FILE_PATH}} /p:Platform=x64,Configuration=${{env.CONFIGURATION}} /p:PlatformToolset=v143
